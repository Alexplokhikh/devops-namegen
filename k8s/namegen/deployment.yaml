apiVersion: apps/v1
kind: Deployment
metadata:
  name: namegen
  namespace: default
  labels:
    app: namegen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: namegen
  template:
    metadata:
      labels:
        app: namegen
    spec:
      containers:
        - name: namegen
          image: 044014415398.dkr.ecr.eu-central-1.amazonaws.com/devops-namegen:bootstrap
          ports:
            - containerPort: 8080
          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-url
          readinessProbe:
            httpGet:
              path: /api/random_name
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/random_name
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
