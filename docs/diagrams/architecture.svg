<text x="235" y="385" class="small">HTTP</text><text x="520" y="385" class="small">80</text><text x="790" y="375" class="small">8080</text>
<text x="535" y="120" class="small">OIDC</text><text x="665" y="85" class="small">build + push</text><text x="978" y="235" class="small">image pull</text>
